<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- width=device-width makes the page fit the iPhone screen instead of
       being shown as a tiny zoomed-out desktop page. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Lets you "Add to Home Screen" on iPhone and open it like an app. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Monitor">
  <meta name="theme-color" content="#111418">
  <title>Monitor</title>
  <style>
    :root {
      --bg: #111418; --card: #1b2027; --text: #e8ecf1; --muted: #8a94a3;
      --on: #22c55e; --off: #ef4444; --warn: #f59e0b;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; min-height: 100dvh; background: var(--bg); color: var(--text);
      font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 24px;
      /* env(safe-area-inset-*) keeps content clear of the iPhone notch/home bar */
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
    }
    h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
    .status {
      width: 100%; max-width: 420px; background: var(--card);
      border-radius: 20px; padding: 28px 20px; text-align: center;
    }
    .dot {
      width: 18px; height: 18px; border-radius: 50%; display: inline-block;
      background: var(--muted); margin-right: 10px; vertical-align: middle;
    }
    .status[data-state="on"]      .dot { background: var(--on);   box-shadow: 0 0 14px var(--on); }
    .status[data-state="off"]     .dot { background: var(--off); }
    .status[data-state="offline"] .dot { background: var(--warn); }
    .state { font-size: 2.4rem; font-weight: 700; vertical-align: middle; }
    .sub { margin-top: 8px; color: var(--muted); font-size: .9rem; }
    .buttons { width: 100%; max-width: 420px; display: grid; gap: 16px; }
    button {
      font: inherit; font-size: 1.8rem; font-weight: 700; color: #fff;
      border: 0; border-radius: 20px; min-height: 96px; width: 100%;
      cursor: pointer; touch-action: manipulation;
    }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #on  { background: var(--on); }
    #off { background: var(--off); }
  </style>
</head>
<body>
  <h1 id="title">Monitor</h1>

  <div class="status" id="status" data-state="unknown">
    <span class="dot"></span><span class="state" id="state">...</span>
    <div class="sub" id="sub">Connecting</div>
  </div>

  <div class="buttons">
    <button id="on"  type="button">ON</button>
    <button id="off" type="button">OFF</button>
  </div>

<script>
const statusEl = document.getElementById("status");
const stateEl  = document.getElementById("state");
const subEl    = document.getElementById("sub");
const titleEl  = document.getElementById("title");
const buttons  = [document.getElementById("on"), document.getElementById("off")];

let failures = 0;          // consecutive failed checks
let lastGood = null;       // time of last successful contact with the plug

// Redraw the page. s.server === false means the web server itself is
// unreachable (e.g. phone lost Wi-Fi/Tailscale); otherwise it is the plug.
function render(s) {
  if (!s.online) {
    failures++;
    statusEl.dataset.state = "offline";
    stateEl.textContent = "OFFLINE";
    const what = s.server === false
      ? "Can't reach the server (check this device's Wi-Fi/Tailscale)."
      : "Can't reach the plug (power or Wi-Fi problem).";
    const since = lastGood ? " Last seen " + lastGood.toLocaleTimeString() + "." : "";
    subEl.textContent = what + since + " Retrying automatically...";
  } else {
    failures = 0;
    lastGood = new Date();
    statusEl.dataset.state = s.on ? "on" : "off";
    stateEl.textContent = s.on ? "ON" : "OFF";
    subEl.textContent = "Updated " + lastGood.toLocaleTimeString();
  }
}

// Wrap fetch so failures show as "offline" instead of throwing. A timeout
// stops a hung request from freezing the page.
async function call(path, method) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const r = await fetch(path, { method, signal: ctl.signal, cache: "no-store" });
    const data = await r.json();
    return (data && typeof data.online === "boolean") ? data : { online: false };
  } catch (e) {
    return { online: false, server: false };
  } finally {
    clearTimeout(timer);
  }
}

// One check at a time: the next poll is only scheduled after the previous
// one finishes, so slow/failed requests can't pile up or arrive out of order.
let busy = false, timer = null;
async function refresh() {
  if (busy) return;
  busy = true;
  clearTimeout(timer);
  try { render(await call("/api/status", "GET")); }
  finally {
    busy = false;
    // Poll every 3 s; back off to 10 s while offline to go easy on the plug.
    timer = setTimeout(refresh, failures > 2 ? 10000 : 3000);
  }
}

async function press(path) {
  buttons.forEach(b => b.disabled = true);   // stop double taps
  try { render(await call(path, "POST")); }
  finally {
    buttons.forEach(b => b.disabled = false);
    clearTimeout(timer);
    timer = setTimeout(refresh, 3000);
  }
}

document.getElementById("on").addEventListener("click",  () => press("/api/on"));
document.getElementById("off").addEventListener("click", () => press("/api/off"));

refresh();
// Refresh immediately when the iPhone returns to this tab/app.
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
